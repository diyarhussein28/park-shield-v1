---
- name: Install baseline packages
  ansible.builtin.apt:
    name: [unattended-upgrades, chrony, prometheus-node-exporter, nftables, cryptsetup, jq]
    state: present
    update_cache: true

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

- name: SSH only on private and WireGuard interfaces, keys only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/20-parkshield.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      AllowTcpForwarding no
      X11Forwarding no
      ListenAddress {{ ansible_host }}
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Keep system logs 14 days without growing unbounded
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/parkshield.conf
    content: |
      [Journal]
      MaxRetentionSec={{ log_retention_days }}day
      SystemMaxUse=2G
    mode: '0644'
  notify: Restart journald

- name: Node exporter listens on the private interface only
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    content: 'ARGS="--web.listen-address={{ ansible_host }}:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter"'
    mode: '0644'
  notify: Restart node exporter
