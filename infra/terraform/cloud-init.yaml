#cloud-config
# Minimal bootstrap; everything else is Ansible. Password logins are disabled from first boot.
ssh_pwauth: false
disable_root: false
package_update: true
package_upgrade: true
packages:
  - python3
  - unattended-upgrades
write_files:
  - path: /etc/ssh/sshd_config.d/10-parkshield.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
runcmd:
  - systemctl restart ssh
